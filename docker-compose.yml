services:
  # PostgreSQL Database for Snapshots & Historical Metrics
  postgres:
    image: postgres:15-alpine
    container_name: ocp-portal-postgres
    environment:
      POSTGRES_DB: openshift_portal
      POSTGRES_USER: portal_user
      POSTGRES_PASSWORD: portal_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_user -d openshift_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Broker for Asynchronous Report Generation and Queue Dispatch
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ocp-portal-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Sandbox SMTP server: catches every report and alert email; read them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: ocp-portal-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  # Sandbox directory standing in for the corporate LDAP / Active Directory (users and groups: ldap/bootstrap.ldif)
  openldap:
    image: osixia/openldap:1.5.0
    container_name: ocp-portal-ldap
    command: --copy-service
    environment:
      LDAP_ORGANISATION: OpenShift Portal Sandbox
      LDAP_DOMAIN: portal.local
      # Must match bindCredential in keycloak/openshift-portal-realm.json
      LDAP_ADMIN_PASSWORD: ldap-admin-sandbox
    volumes:
      - ./ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-portal.ldif:ro
    # slapd sizes its tables from the open-file limit; Docker's default is large enough to exhaust memory
    ulimits:
      nofile:
        soft: 1024
        hard: 1024

  # Keycloak: imports the openshift-portal realm, which federates the sandbox LDAP and maps its groups to roles
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: ocp-portal-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081
      # Tokens carry this issuer whether the browser or another container asked for them
      KC_HOSTNAME_URL: http://localhost:8081
    volumes:
      - ./keycloak/openshift-portal-realm.json:/opt/keycloak/data/import/openshift-portal-realm.json:ro
      # Portal login theme (keycloak/themes/portal), set as the realm's login theme
      - ./keycloak/themes/portal:/opt/keycloak/themes/portal:ro
    ports:
      - "8081:8081"
    depends_on:
      - openldap

  # OpenShift Operations Portal Core Service
  core-service:
    build:
      context: ./core-service
      dockerfile: Dockerfile
    container_name: ocp-portal-core
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openshift_portal
      SPRING_DATASOURCE_USERNAME: portal_user
      SPRING_DATASOURCE_PASSWORD: portal_secret
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      # Sign-in through Keycloak; sandbox users are in ldap/bootstrap.ldif
      OPENSHIFT_PORTAL_SECURITY_ENABLED: "true"
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/openshift-portal
      # Browsers reach Keycloak at localhost:8081; from this container it is the keycloak service
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8081/realms/openshift-portal/protocol/openid-connect/certs
      OPENSHIFT_PORTAL_SIMULATOR_ENABLED: "true"
      OPENSHIFT_PORTAL_RABBITMQ_ENABLED: "true"
      # Report schedules and alerts are emailed through Mailpit (sandbox only)
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      OPENSHIFT_PORTAL_NOTIFICATIONS_FROM: portal@openshift-portal.local
      OPENSHIFT_PORTAL_NOTIFICATIONS_ALERTRECIPIENTS: platform-ops@openshift-portal.local
      OPENSHIFT_PORTAL_NOTIFICATIONS_PORTALURL: http://localhost:4200
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Angular Operations Portal Frontend & Nginx Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ocp-portal-ui
    ports:
      - "4200:80"
    depends_on:
      - core-service

volumes:
  postgres_data:

