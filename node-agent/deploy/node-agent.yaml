# Node agent for one managed cluster. Apply it in the managed cluster (not the hub), after setting CLUSTER_NAME to
# the cluster's ManagedCluster name, the portal and Keycloak URLs, and the client secret. With ACM, a Policy can roll
# this out to every cluster and fill CLUSTER_NAME with the {{hub .ManagedClusterName hub}} template.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-portal-node-agent
  labels:
    app.kubernetes.io/name: openshift-portal-node-agent
    app.kubernetes.io/part-of: openshift-operations-portal
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-agent
  namespace: openshift-portal-node-agent
---
# Read-only: the agent lists nodes and nothing else
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openshift-portal-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshift-portal-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openshift-portal-node-reader
subjects:
  - kind: ServiceAccount
    name: node-agent
    namespace: openshift-portal-node-agent
---
apiVersion: v1
kind: Secret
metadata:
  name: node-agent-credentials
  namespace: openshift-portal-node-agent
type: Opaque
stringData:
  # Keycloak client of this agent (confidential, service account with the portal-node-agent realm role)
  client-id: portal-node-agent
  client-secret: REPLACE_WITH_CLIENT_SECRET
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-agent-config
  namespace: openshift-portal-node-agent
data:
  CLUSTER_NAME: REPLACE_WITH_MANAGED_CLUSTER_NAME
  PORTAL_URL: https://openshift-operations-portal.apps.hub.example.com/api/v1
  PORTAL_TOKEN_URI: https://keycloak.apps.hub.example.com/realms/openshift-portal/protocol/openid-connect/token
  REPORT_INTERVAL: PT5M
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-agent
  namespace: openshift-portal-node-agent
  labels:
    app.kubernetes.io/name: openshift-portal-node-agent
    app.kubernetes.io/part-of: openshift-operations-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openshift-portal-node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshift-portal-node-agent
        app.kubernetes.io/part-of: openshift-operations-portal
    spec:
      serviceAccountName: node-agent
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node-agent
          # A registry every managed cluster can pull from (air-gapped: your mirror, e.g. Quay)
          image: registry.example.com/openshift-portal/node-agent:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: node-agent-config
          env:
            - name: PORTAL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: node-agent-credentials
                  key: client-id
            - name: PORTAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: node-agent-credentials
                  key: client-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            # Measured: about 250 MB resident while reporting every few seconds
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            # The JVM and Tomcat need a writable /tmp on a read-only root filesystem
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
