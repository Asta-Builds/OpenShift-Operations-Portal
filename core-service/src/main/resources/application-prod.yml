spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/openshift_portal}
    username: ${SPRING_DATASOURCE_USERNAME:portal_user}
    password: ${SPRING_DATASOURCE_PASSWORD:portal_secret}
    driverClassName: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # A failed report or email is recorded as a notification; redelivering it could email recipients twice
        default-requeue-rejected: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Issuer exactly as browsers reach Keycloak; tokens carrying any other issuer are rejected.
          # When the backend cannot reach that URL (e.g. localhost inside Docker), also set
          # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI to Keycloak's internal JWKS endpoint.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}
          # Only tokens minted for this API (Keycloak audience mapper) are accepted
          audiences: ${KEYCLOAK_AUDIENCE:portal-api}

openshift:
  portal:
    # Fail closed: production requires a JWT issuer (KEYCLOAK_ISSUER_URI) and never serves simulated data
    # unless these are overridden explicitly (docker-compose does so for the local sandbox).
    security:
      enabled: ${OPENSHIFT_PORTAL_SECURITY_ENABLED:true}
    simulator:
      enabled: ${OPENSHIFT_PORTAL_SIMULATOR_ENABLED:false}
    rabbitmq:
      enabled: ${OPENSHIFT_PORTAL_RABBITMQ_ENABLED:true}
