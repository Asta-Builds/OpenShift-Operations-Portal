spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/openshift_portal}
    username: ${SPRING_DATASOURCE_USERNAME:portal_user}
    password: ${SPRING_DATASOURCE_PASSWORD:portal_secret}
    driverClassName: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/openshift-portal}

openshift:
  portal:
    security:
      enabled: true
    simulator:
      enabled: false
