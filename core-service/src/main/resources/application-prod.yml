spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/openshift_portal}
    username: ${SPRING_DATASOURCE_USERNAME:portal_user}
    password: ${SPRING_DATASOURCE_PASSWORD:portal_secret}
    driverClassName: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}

openshift:
  portal:
    security:
      enabled: ${OPENSHIFT_PORTAL_SECURITY_ENABLED:false}
    simulator:
      enabled: ${OPENSHIFT_PORTAL_SIMULATOR_ENABLED:true}
    rabbitmq:
      enabled: ${OPENSHIFT_PORTAL_RABBITMQ_ENABLED:true}
