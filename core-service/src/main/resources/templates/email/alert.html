<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${heading}">OpenShift Operations Portal Alert</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f5f7; margin: 0; padding: 20px; }
        .container { background-color: #ffffff; padding: 24px; border-radius: 8px; max-width: 600px; margin: 0 auto; border: 1px solid #e5e7eb; }
        .header { border-bottom: 2px solid #ee0000; padding-bottom: 12px; margin-bottom: 18px; }
        .title { color: #ee0000; font-size: 20px; font-weight: bold; margin: 0; }
        .subtitle { color: #6b7280; font-size: 13px; margin-top: 4px; }
        .content { color: #374151; font-size: 14px; line-height: 1.6; }
        .footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid #e5e7eb; font-size: 12px; color: #9ca3af; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title" th:text="${heading}">License cap exceeded</h1>
            <div class="subtitle" th:text="'OpenShift Operations Portal alert, ' + ${generatedAt}">OpenShift Operations Portal alert</div>
        </div>
        <div class="content">
            <p th:each="line : ${lines}" th:text="${line}">The high watermark is 640 cores; the contracted cap is 500 cores.</p>
            <p th:if="${portalLink != null}">Details: <a th:href="${portalLink}" th:text="${portalLink}">the portal</a></p>
        </div>
        <div class="footer">
            Sent at most once a day per alert, to the portal's alert recipients (openshift.portal.notifications.alert-recipients).
        </div>
    </div>
</body>
</html>
