server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: openshift-operations-portal
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false

# ACM Hub Collection & Simulator Configuration
openshift:
  portal:
    collector:
      enabled: true
      # Every 15 minutes by default
      cron: "0 */15 * * * *"
      connect-timeout-ms: 5000
      read-timeout-ms: 10000
    simulator:
      enabled: true
      default-clusters: 5
    # Namespace labels naming the owning team and cost center; an organisation-owned prefix is recommended
    attribution:
      owner-label: openshift.io/owner-team
      cost-center-label: cost-center
    # Nodes of live clusters come from the node agent in each cluster; older reports are ignored
    node-agent:
      max-report-age: PT1H
    licensing:
      default-core-multiplier: 1.0
      bare-metal-socket-factor: 16

# Resilience4j for ACM Hub calls: each hub gets its own circuit breaker and retry built from these configs
resilience4j:
  circuitbreaker:
    configs:
      acmHub:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        # A hub is called once per collection cycle, so a single successful probe closes the breaker again
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    configs:
      acmHub:
        max-attempts: 3
        # Waits T_base x 2^(k-1) before retry k: 2s, then 4s
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 30s
        # Only transport failures and 5xx answers are retried; authentication/authorization errors are not
        retry-exceptions:
          - com.openshift.portal.exception.AcmConnectionException

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
