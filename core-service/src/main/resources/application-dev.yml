spring:
  datasource:
    url: jdbc:h2:mem:openshiftdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false # H2 dev mode uses ddl-auto; Flyway is enabled in prod profile with PostgreSQL

openshift:
  portal:
    security:
      enabled: false # Local dev mode allows unauthenticated exploration of portal APIs
    simulator:
      enabled: true
