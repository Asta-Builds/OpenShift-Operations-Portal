spring:
  datasource:
    url: jdbc:h2:mem:openshiftdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true # H2 runs the same migrations as PostgreSQL in prod

openshift:
  portal:
    security:
      enabled: false # Local dev mode allows unauthenticated exploration of portal APIs
    simulator:
      enabled: true
