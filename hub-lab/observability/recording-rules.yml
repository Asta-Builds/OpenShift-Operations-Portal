# The recording rules the portal's default queries rely on, as kube-prometheus / OpenShift define them, grouped by
# cluster the way ACM Observability federates them.
groups:
  - name: portal-namespace-rules
    rules:
      # Requests of running and pending pods only, per namespace
      - record: namespace_cpu:kube_pod_container_resource_requests:sum
        expr: |
          sum by (cluster, namespace) (
            kube_pod_container_resource_requests{resource="cpu"}
            * on (cluster, namespace, pod) group_left()
            max by (cluster, namespace, pod) (kube_pod_status_phase{phase=~"Pending|Running"} == 1)
          )
      - record: namespace_memory:kube_pod_container_resource_requests:sum
        expr: |
          sum by (cluster, namespace) (
            kube_pod_container_resource_requests{resource="memory"}
            * on (cluster, namespace, pod) group_left()
            max by (cluster, namespace, pod) (kube_pod_status_phase{phase=~"Pending|Running"} == 1)
          )
      - record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate
        expr: |
          sum by (cluster, namespace, pod, container) (
            irate(container_cpu_usage_seconds_total{container!="", image!=""}[5m])
          )
