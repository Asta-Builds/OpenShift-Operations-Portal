name: Unit Tests & Code Coverage Pipeline

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'core-service/**'
      - 'node-agent/**'
      - 'frontend/**'
      - 'openshift/**'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Spring Boot Core Service Unit Tests & JaCoCo Coverage
  # =========================================================================
  backend-unit-tests:
    name: Backend Unit Tests (Core Service)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x ./core-service/mvnw

      - name: Run Maven Unit Tests & Generate JaCoCo Coverage
        working-directory: ./core-service
        run: |
          ./mvnw clean test -Dspring.profiles.active=dev

      - name: Upload Surefire Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-test-results
          path: ./core-service/target/surefire-reports/
          retention-days: 14

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-coverage-report
          path: ./core-service/target/site/jacoco/
          retention-days: 14

      - name: Publish Test Summary to GitHub Actions
        if: always()
        run: |
          echo "### Backend Unit Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -d "./core-service/target/surefire-reports" ]; then
            echo "- **Status:** Tests executed successfully." >> $GITHUB_STEP_SUMMARY
            TOTAL_TESTS=$(grep -h "tests=" ./core-service/target/surefire-reports/*.xml 2>/dev/null | sed -E 's/.*tests="([0-9]+)".*/\1/' | awk '{s+=$1} END {print s}')
            FAILURES=$(grep -h "failures=" ./core-service/target/surefire-reports/*.xml 2>/dev/null | sed -E 's/.*failures="([0-9]+)".*/\1/' | awk '{s+=$1} END {print s}')
            ERRORS=$(grep -h "errors=" ./core-service/target/surefire-reports/*.xml 2>/dev/null | sed -E 's/.*errors="([0-9]+)".*/\1/' | awk '{s+=$1} END {print s}')
            echo "- **Total Tests Run:** ${TOTAL_TESTS:-0}" >> $GITHUB_STEP_SUMMARY
            echo "- **Failures:** ${FAILURES:-0}" >> $GITHUB_STEP_SUMMARY
            echo "- **Errors:** ${ERRORS:-0}" >> $GITHUB_STEP_SUMMARY
          fi

  # =========================================================================
  # 2. Node Agent Unit Tests & JaCoCo Coverage
  # =========================================================================
  node-agent-unit-tests:
    name: Node Agent Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Unit Tests & Generate JaCoCo Coverage
        working-directory: ./node-agent
        run: ./mvnw clean test

      - name: Upload Surefire Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-agent-surefire-test-results
          path: ./node-agent/target/surefire-reports/
          retention-days: 14

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-agent-jacoco-coverage-report
          path: ./node-agent/target/site/jacoco/
          retention-days: 14

  # =========================================================================
  # 3. Angular Operations Portal Unit Tests & Build Verification
  # =========================================================================
  frontend-unit-tests:
    name: Frontend Unit Tests & Build (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Angular Unit Tests (Headless Chrome)
        working-directory: ./frontend
        run: npm run test -- --no-watch --no-progress --browsers=ChromeHeadlessCI --code-coverage

      - name: Verify Production Bundle Build
        working-directory: ./frontend
        run: npm run build -- --configuration production

      - name: Upload Frontend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: ./frontend/coverage/
          retention-days: 14

  # =========================================================================
  # 4. OpenShift Manifests: Kustomize overlays, ACM Policy and Tekton pipeline
  # =========================================================================
  openshift-manifests:
    name: OpenShift Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUSTOMIZE_VERSION: v5.4.3
      KUBECONFORM_VERSION: v0.6.7

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install kustomize, kubeconform and PyYAML
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kustomize
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          pip install pyyaml

      - name: Validate Manifests
        run: ./openshift/validate.sh

  # =========================================================================
  # 5. Container Images, run the way OpenShift runs them: an arbitrary UID in group 0, no capabilities, and a
  #    read-only root filesystem for the Java services
  # =========================================================================
  container-images:
    name: Container Images (OpenShift Security Context)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_AS: --user 1000770000:0 --cap-drop ALL --security-opt no-new-privileges

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Images
        run: |
          docker build -t portal-core-service:ci core-service
          docker build -t portal-node-agent:ci node-agent
          docker build -t portal-ui:ci frontend

      - name: UI Serves the App and Proxies the API
        run: |
          # Nothing listens on port 9, so a proxied API call must come back as 502 from nginx
          docker run -d --name ui $RUN_AS -e PORTAL_API_URL=http://127.0.0.1:9 -p 8080:8080 portal-ui:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz && break; sleep 1; done
          curl -sf http://localhost:8080/healthz | grep -qx ok
          curl -sf http://localhost:8080/ | grep -q '<app-root'
          curl -sf http://localhost:8080/clusters | grep -q '<app-root'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/auth/config)" = 502
          docker exec ui grep -q 'proxy_pass http://127.0.0.1:9/api/v1/' /etc/nginx/conf.d/default.conf

      - name: Core Service Starts Read-Only
        run: |
          docker run -d --name core $RUN_AS --read-only --tmpfs /tmp -e SPRING_PROFILES_ACTIVE=dev -p 8081:8080 portal-core-service:ci
          for i in $(seq 1 90); do curl -sf http://localhost:8081/api/v1/actuator/health/liveness && break; sleep 2; done
          curl -sf http://localhost:8081/api/v1/actuator/health/liveness | grep -q '"UP"'
          curl -sf http://localhost:8081/api/v1/actuator/health/readiness | grep -q '"UP"'

      - name: Node Agent Starts Read-Only
        run: |
          # No cluster to read here; the agent must still start and report itself alive
          docker run -d --name node-agent $RUN_AS --read-only --tmpfs /tmp -e CLUSTER_NAME=ci -e PORTAL_URL=http://127.0.0.1:9/api/v1 \
            -e REPORT_INITIAL_DELAY=PT1H -p 8082:8080 portal-node-agent:ci
          for i in $(seq 1 60); do curl -sf http://localhost:8082/actuator/health/liveness && break; sleep 2; done
          curl -sf http://localhost:8082/actuator/health/liveness | grep -q '"UP"'

      - name: Container Logs
        if: always()
        run: |
          for c in ui core node-agent; do echo "::group::$c"; docker logs "$c" 2>&1 | tail -100 || true; echo "::endgroup::"; done

  # =========================================================================
  # 6. Aggregated Pipeline Verification
  # =========================================================================
  pipeline-success:
    name: Pipeline Verification Gate
    needs: [backend-unit-tests, node-agent-unit-tests, frontend-unit-tests, openshift-manifests, container-images]
    runs-on: ubuntu-latest
    steps:
      - name: Final Quality Gate
        run: |
          echo "All unit tests, builds, OpenShift manifests and container images passed the CI Quality Gate!" >> $GITHUB_STEP_SUMMARY
