# The token (and CA) of every registered ACM hub, where the core service looks for them:
# /var/run/secrets/acm-hubs/<credentialsSecretRef>/token and ca.crt. Add one source per hub; create each Secret with
# the output of openshift/acm/hub-reader.yaml (see openshift/README.md). Leave out ca.crt for a publicly trusted CA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshift-operations-portal-core
spec:
  template:
    spec:
      containers:
        - name: core-service
          volumeMounts:
            - name: acm-hub-credentials
              mountPath: /var/run/secrets/acm-hubs
              readOnly: true
      volumes:
        - name: acm-hub-credentials
          projected:
            sources:
              - secret:
                  name: hub-east-credentials
                  items:
                    - key: token
                      path: hub-east-credentials/token
                    - key: ca.crt
                      path: hub-east-credentials/ca.crt
