# The core service (REST API, collector, schedules). Two replicas: scheduled jobs take a lock in PostgreSQL, so each
# runs on one replica at a time.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openshift-operations-portal
# It reads ACM hubs with the hub tokens mounted below, never with its own identity
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshift-operations-portal-core
  labels:
    app.kubernetes.io/name: openshift-operations-portal-core
    app.kubernetes.io/component: core-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: openshift-operations-portal-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshift-operations-portal-core
        app.kubernetes.io/component: core-service
    spec:
      serviceAccountName: openshift-operations-portal
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: core-service
          image: core-service
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: openshift-operations-portal-config
            - secretRef:
                name: openshift-operations-portal-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          # Flyway migrations run before the app answers, so the first start can take a while
          startupProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: http
            periodSeconds: 10
          volumeMounts:
            # The JVM and Tomcat write to /tmp on a read-only root filesystem
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: openshift-operations-portal-core
  labels:
    app.kubernetes.io/name: openshift-operations-portal-core
spec:
  selector:
    app.kubernetes.io/name: openshift-operations-portal-core
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openshift-operations-portal-core
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openshift-operations-portal-core
