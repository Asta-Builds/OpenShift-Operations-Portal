apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openshift-operations-portal-rabbitmq
  labels:
    app.kubernetes.io/name: openshift-operations-portal-rabbitmq
    app.kubernetes.io/component: message-broker
spec:
  serviceName: openshift-operations-portal-rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openshift-operations-portal-rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshift-operations-portal-rabbitmq
        app.kubernetes.io/component: message-broker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq
          ports:
            - containerPort: 5672
              name: amqp
          env:
            # Data and the Erlang cookie live on the volume, which OpenShift makes writable for the pod's UID
            - name: HOME
              value: /var/lib/rabbitmq
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: openshift-operations-portal-secrets
                  key: SPRING_RABBITMQ_USERNAME
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: openshift-operations-portal-secrets
                  key: SPRING_RABBITMQ_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "status"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openshift-operations-portal-rabbitmq
  labels:
    app.kubernetes.io/name: openshift-operations-portal-rabbitmq
spec:
  selector:
    app.kubernetes.io/name: openshift-operations-portal-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openshift-operations-portal-rabbitmq-from-core
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openshift-operations-portal-rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openshift-operations-portal-core
      ports:
        - port: 5672
          protocol: TCP
