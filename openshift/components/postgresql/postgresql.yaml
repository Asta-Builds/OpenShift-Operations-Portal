apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openshift-operations-portal-db
  labels:
    app.kubernetes.io/name: openshift-operations-portal-db
    app.kubernetes.io/component: database
spec:
  serviceName: openshift-operations-portal-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openshift-operations-portal-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshift-operations-portal-db
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: postgresql
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRESQL_DATABASE
              value: openshift_portal
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: openshift-operations-portal-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openshift-operations-portal-secrets
                  key: SPRING_DATASOURCE_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # The Red Hat image's own checks, as in OpenShift's postgresql-persistent template
          readinessProbe:
            exec:
              command: ["/usr/libexec/check-container"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/usr/libexec/check-container", "--live"]
            initialDelaySeconds: 120
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openshift-operations-portal-db
  labels:
    app.kubernetes.io/name: openshift-operations-portal-db
spec:
  selector:
    app.kubernetes.io/name: openshift-operations-portal-db
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openshift-operations-portal-db-from-core
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openshift-operations-portal-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openshift-operations-portal-core
      ports:
        - port: 5432
          protocol: TCP
