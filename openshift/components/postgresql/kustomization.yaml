# A single PostgreSQL instance for a proof of concept or a small installation. In production prefer your managed
# database or an operator (Crunchy PGO, CloudNativePG) and point SPRING_DATASOURCE_URL at it instead.
# Its user and password are the portal's SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - postgresql.yaml

images:
  - name: postgresql
    newName: registry.redhat.io/rhel9/postgresql-15
    newTag: latest
